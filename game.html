<html lang="ja">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --bar:#2a78d6; --bar-soft:#9ec5f4; --good:#2f9e5b; --bad:#d64545; --radius:8px; --gap:14px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10); --bar:#3987e5; --bar-soft:#1c5cab;
  --good:#3fbd72; --bad:#e2685f; } }
body { font-family: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--page); color:var(--ink-1); line-height:1.5; }
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;}
.topnav .brand{font-weight:700;font-size:15px;color:var(--ink-1);text-decoration:none;white-space:nowrap;}
.topnav .navlinks{display:flex;gap:4px;flex-wrap:wrap;}
.topnav .navlinks a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;}
.topnav .navlinks a:hover{background:color-mix(in srgb,var(--ink-1) 7%,transparent);}
.topnav .navlinks a.active{background:#2a78d6;color:#fff;}
.topnav .spacer{flex:1;}
#lang-toggle,#logout-btn{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
#lang-toggle:hover,#logout-btn:hover{background:color-mix(in srgb,var(--ink-1) 7%,transparent);}
.wrap { max-width:1280px; margin:0 auto; padding:18px var(--gap) 40px; }
header h1 { font-size:20px; font-weight:700; }
header .sub { font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.filters { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:16px 0 6px; }
.fg { display:flex; align-items:center; gap:6px; }
.fg label { font-size:12px; color:var(--ink-2); }
.fg select { padding:6px 10px; font-size:16px; color:var(--ink-1); max-width:320px;
  background:var(--surface); border:1px solid var(--border); border-radius:6px; }
.fg select:disabled { opacity:.45; }
.empty { padding:40px 0; text-align:center; color:var(--ink-muted); font-size:13px; }
.scorewrap { display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap; margin:20px 0 var(--gap); }
.side { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:160px; }
.side .team { font-size:16px; font-weight:700; text-align:center; }
.side .gl { font-size:12px; color:var(--ink-2); background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:3px 10px; }
.scorebox { background:var(--surface); border:1px solid var(--border); border-radius:16px;
  min-width:96px; padding:14px 20px; text-align:center; font-size:38px; font-weight:750; }
.vs { font-size:12px; color:var(--ink-muted); font-weight:700; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:var(--gap); }
.card h3 { font-size:14px; font-weight:600; margin-bottom:10px; }
.cmp-scroll { overflow-x:auto; }
table.cmp { width:100%; min-width:560px; border-collapse:collapse; font-size:12.5px; }
table.cmp th { font-size:11px; color:var(--ink-muted); font-weight:600; padding:4px 6px; text-align:center; white-space:nowrap; }
table.cmp th.teamhead { font-size:12.5px; color:var(--ink-1); font-weight:700; }
table.cmp td { padding:6px; text-align:center; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cmp td.lbl { text-align:center; font-weight:600; color:var(--ink-1); white-space:nowrap; }
table.cmp td.tot { font-weight:700; }
table.cmp tr:hover td { background: color-mix(in srgb, var(--ink-1) 3%, transparent); }
.rosters { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
@media (max-width:820px){ .rosters{grid-template-columns:1fr;} }
table.roster { width:100%; border-collapse:collapse; font-size:12.5px; }
table.roster th { text-align:right; padding:5px 7px; border-bottom:2px solid var(--baseline); color:var(--ink-2); font-size:11px; font-weight:600; white-space:nowrap; }
table.roster th:nth-child(1),table.roster th:nth-child(2){text-align:left;}
table.roster td { padding:4px 7px; border-bottom:1px solid var(--grid); text-align:right; font-variant-numeric:tabular-nums; }
table.roster td:nth-child(1),table.roster td:nth-child(2){text-align:left;}
.roster-scroll { max-height:520px; overflow-y:auto; }
svg text { font-family: inherit; }
.legend { display:flex; gap:14px; font-size:11.5px; color:var(--ink-2); margin-bottom:8px; }
.legend span.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
footer { margin-top:16px; font-size:12px; color:var(--ink-muted); }
#login-screen { display:flex; min-height:70vh; align-items:center; justify-content:center; }
.login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px 30px; width:100%; max-width:320px; }
.login-card h2 { font-size:17px; font-weight:700; margin-bottom:16px; }
.login-card input { width:100%; padding:9px 11px; font-size:16px; margin-bottom:10px;
  background:var(--page); border:1px solid var(--border); border-radius:6px; color:var(--ink-1); }
.login-card button { width:100%; padding:9px; font-size:13.5px; font-weight:600; color:#fff; background:#2a78d6;
  border:none; border-radius:6px; cursor:pointer; margin-top:4px; }
.login-card button:hover { background:#1f63b5; }
.login-card .err { color:var(--bad); font-size:12px; margin-top:8px; min-height:1em; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://lwsrrourcwidrujvaqvr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WUHxP4DDM9FRN4JfduqDNA_-S3lCM2p';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const UI = {
  ja:{ nav_home:'ホーム', nav_kick:'キック', nav_attack:'アタック', nav_defense:'ディフェンス', nav_setpiece:'FWセットプレー', nav_game:'試合サマリー',
    title:'試合サマリー', sub:'試合を選ぶと、前半/後半別のチーム比較・選手ロースター・タックル成否を表示します | データ: Opta (Stats Perform)',
    f_season:'シーズン', f_comp:'コンペティション', f_round:'ラウンド', f_fixture:'試合',
    empty:'該当する試合がありません', loading:'読み込み中...', vs:'vs', half1:'前半', half2:'後半', total:'合計',
    rows:{ carries:'キャリー', carry_distplus:'獲得m', carry_post:'ポストコンタクトm', lqb_pct:'LQB%',
      linebreak:'ラインブレイク', def_beaten:'ディフェンダー突破', offload:'オフロード', entry22:'22m侵入',
      entry22_try_pct:'22mトライ率', pts_per_22:'22m侵入あたり得点', kip_mtr:'KIP獲得m', turnover_con:'被ターンオーバー',
      tackles:'タックル', tackle_pct:'タックル成功率', tk_missed:'ミスタックル', tk_pen_conceded:'タックル反則',
      scrum_pct:'スクラム成功率', lo_pct:'ラインアウト成功率' },
    gainline:'ゲインライン率', roster_title:'選手ロースター', roster_p:'選手','roster_t':'出場(分)','roster_a':'Action/Min',
    tackle_title:'タックル成否(選手別)', tk_succ:'成功', tk_miss:'ミス', lang_btn:'EN',
    login_title:'ログイン', login_btn:'ログイン', logout_btn:'ログアウト',
    foot:'指標定義: LQB%=Ruck 0–3秒÷総ラック / DF Beaten=Attacking Qualities×Defender Beaten / Linebreak=Initial+Supported Break / Offload=Pass×Offload(Own Player/To Ground/To Opposition) / 22mトライ率=22mエントリーのうちトライで終わった割合 / KIP獲得m=Kick in Play(Own 22含む)のDistance+合計 / タックル成功率=Missed/Ineffectiveを除く / Scrum%=Won系÷自ボールスクラム / Lineout%=Won系÷自スロー(フォーメーション投入)。前半/後半は延長戦を後半に含める。データ: Opta(Stats Perform, Level 2 Restricted)。このページはログインしたチームメンバーのみ閲覧できます。' },
  en:{ nav_home:'Home', nav_kick:'Kicking', nav_attack:'Attack', nav_defense:'Defense', nav_setpiece:'Set Piece', nav_game:'Game Summary',
    title:'Game Summary', sub:'Pick a fixture to see the 1st/2nd-half team comparison, player roster, and tackle outcomes | Data: Opta (Stats Perform)',
    f_season:'Season', f_comp:'Competition', f_round:'Round', f_fixture:'Fixture',
    empty:'No matching fixtures', loading:'Loading...', vs:'vs', half1:'1st', half2:'2nd', total:'Total',
    rows:{ carries:'Carry', carry_distplus:'Carry mtr', carry_post:'Post Contact Meter', lqb_pct:'LQB%',
      linebreak:'Linebreak', def_beaten:'DF Beaten', offload:'Offload', entry22:'22m Entry',
      entry22_try_pct:'22m Try%', pts_per_22:'Point Per 22m', kip_mtr:'KIP mtr', turnover_con:'Turnover Con',
      tackles:'Tackle', tackle_pct:'Tackle%', tk_missed:'Miss Tackle', tk_pen_conceded:'DF Penalties',
      scrum_pct:'Scrum%', lo_pct:'Lineout%' },
    gainline:'GainLine%', roster_title:'Player Roster', roster_p:'Player','roster_t':'Time','roster_a':'Action/Min',
    tackle_title:'Tackle Attempts (by player)', tk_succ:'Success', tk_miss:'Miss', lang_btn:'日本語',
    login_title:'Sign in', login_btn:'Sign in', logout_btn:'Sign out',
    foot:'Definitions: LQB% = Ruck 0–3s ÷ all rucks / DF Beaten = Attacking Qualities × Defender Beaten / Linebreak = Initial + Supported Break / Offload = Pass × Offload (Own Player/To Ground/To Opposition) / 22m Try% = share of 22m entries ending in a try / KIP mtr = Distance+ on Kick in Play (incl. Own 22) / Tackle% excludes Missed/Ineffective / Scrum% = Won variants ÷ own-ball scrums / Lineout% = Won variants ÷ own throws (formation throws only). Extra time folds into the 2nd half. Data: Opta (Stats Perform, Level 2 Restricted). This page is only visible to signed-in team members.' }
};
let LANG = localStorage.getItem('rugbyAnalyticsLang') || ((navigator.language||'').toLowerCase().startsWith('ja') ? 'ja' : 'en');
function U(){ return UI[LANG]; }
const NS='http://www.w3.org/2000/svg';
const TM = ['carries','carry_distplus','carry_post','gainline','def_beaten','linebreak','offload','entry22',
  'entry22_try','points','turnover_con','tackles','tk_succ','tk_missed','tk_pen_conceded','scrum','scrum_won',
  'lo_total','lo_won','ruck','lqb','kip_mtr'];
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e; }
function cssColor(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

const ROWS = [
  {key:'carries', kind:'count'},
  {key:'carry_distplus', kind:'sum'},
  {key:'carry_post', kind:'sum'},
  {key:'lqb_pct', kind:'rate', num:'lqb', den:'ruck'},
  {key:'linebreak', kind:'count'},
  {key:'def_beaten', kind:'count'},
  {key:'offload', kind:'count'},
  {key:'entry22', kind:'count'},
  {key:'entry22_try_pct', kind:'rate', num:'entry22_try', den:'entry22'},
  {key:'pts_per_22', kind:'ratio2', num:'points', den:'entry22'},
  {key:'kip_mtr', kind:'sum'},
  {key:'turnover_con', kind:'count'},
  {key:'tackles', kind:'count'},
  {key:'tackle_pct', kind:'rate', num:'tk_succ', den:'tackles'},
  {key:'tk_missed', kind:'count'},
  {key:'tk_pen_conceded', kind:'count'},
  {key:'scrum_pct', kind:'rate', num:'scrum_won', den:'scrum'},
  {key:'lo_pct', kind:'rate', num:'lo_won', den:'lo_total'}
];

// --- reference data (fetched once after login) ---
let COMPS=[], TEAMS=[], PLAYERS=[], FIXTURES=[];
async function fetchAll(table, columns){
  let out=[], from=0; const pageSize=1000;
  while(true){
    const { data, error } = await sb.from(table).select(columns).range(from, from+pageSize-1);
    if(error) throw error;
    out = out.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }
  return out;
}
async function loadReference(){
  const [comps, teams, players, fixtures] = await Promise.all([
    fetchAll('comps','id,name'), fetchAll('teams','id,name'),
    fetchAll('players','id,name'), fetchAll('fixtures','*'),
  ]);
  COMPS=[]; comps.forEach(c=>COMPS[c.id]=c.name);
  TEAMS=[]; teams.forEach(c=>TEAMS[c.id]=c.name);
  PLAYERS=[]; players.forEach(c=>PLAYERS[c.id]=c.name);
  FIXTURES = fixtures;
}
function fillZero(row){ const o={}; TM.forEach(m=>o[m]=row&&row[m]!=null?row[m]:0); return o; }
function sumM(a,b){ const o={}; TM.forEach(m=>o[m]=(a[m]||0)+(b[m]||0)); return o; }
function teamMetricsFrom(rows, side){
  const p1=fillZero(rows.find(r=>r.side===side && r.period===1));
  const p2=fillZero(rows.find(r=>r.side===side && r.period===2));
  return {1:p1, 2:p2, total:sumM(p1,p2)};
}
function rowVal(m,row){ if(row.kind==='rate') return m[row.den]?m[row.num]/m[row.den]*100:null;
  if(row.kind==='ratio2') return m[row.den]?m[row.num]/m[row.den]:null; return m[row.key]; }
function fmtVal(v,row){ if(v==null) return '–'; if(row.kind==='rate') return v.toFixed(1)+'%'; if(row.kind==='ratio2') return v.toFixed(2); return Math.round(v).toLocaleString(); }

// --- filters ---
const F = { season:()=>v('f-season'), comp:()=>v('f-comp'), round:()=>v('f-round'), fixture:()=>v('f-fixture') };
function v(id){ return document.getElementById(id).value; }
function fxFilt(){ const season=F.season(),comp=F.comp(),round=F.round();
  return FIXTURES.filter(r=>(season==='all'||String(r.season)===season)&&(comp==='all'||COMPS[r.comp_id]===comp)&&(round==='all'||String(r.round)===round)); }
function dateKey(d){ const p=String(d).split('/'); return p.length===3?p[2]+p[1].padStart(2,'0')+p[0].padStart(2,'0'):String(d); }
function repop(sel,values,current,allLabel){ const s=document.getElementById(sel); const prev=current!==undefined?current:s.value; s.replaceChildren();
  if(allLabel!==null){ const a=document.createElement('option'); a.value='all'; a.textContent=allLabel; s.appendChild(a); }
  values.forEach(x=>{ const o=document.createElement('option'); o.value=String(x.value!==undefined?x.value:x); o.textContent=x.label!==undefined?x.label:String(x); s.appendChild(o); });
  const opts=[...s.options].map(o=>o.value); s.value=opts.includes(prev)?prev:opts[0]; }
function syncFilters(keepFixture){
  const seasons=[...new Set(FIXTURES.map(r=>r.season))].sort((a,b)=>b-a);
  repop('f-season', seasons, F.season()||String(seasons[0]), null);
  const s2=F.season();
  const compRows = FIXTURES.filter(r=>String(r.season)===s2);
  const comps=[...new Set(compRows.map(r=>COMPS[r.comp_id]))].sort();
  repop('f-comp', comps, F.comp(), null);
  const comp=F.comp();
  const roundRows = compRows.filter(r=>COMPS[r.comp_id]===comp);
  const rounds=[...new Set(roundRows.map(r=>r.round))].sort((a,b)=>a-b);
  repop('f-round', rounds, F.round(), null);
  const fxRows = fxFilt();
  const fxOpts = fxRows.map(r=>({value:r.id, label:TEAMS[r.home_team_id]+' '+U().vs+' '+TEAMS[r.away_team_id]+'  ('+r.date_played+')', date:r.date_played}))
    .sort((a,b)=>dateKey(b.date).localeCompare(dateKey(a.date)));
  const prevFx = keepFixture ? F.fixture() : undefined;
  repop('f-fixture', fxOpts, prevFx, null);
}

// --- rendering ---
async function render(){
  const content = document.getElementById('content');
  const fxIdVal = F.fixture();
  const fx = FIXTURES.find(r=>String(r.id)===fxIdVal);
  if(!fx){ content.innerHTML='<div class="empty">'+U().empty+'</div>'; return; }
  content.innerHTML = '<div class="empty">'+U().loading+'</div>';

  const [teamRes, playerRes] = await Promise.all([
    sb.from('team_match_stats').select('*').eq('fixture_id', fx.id),
    sb.from('player_match_stats').select('*').eq('fixture_id', fx.id),
  ]);
  if(teamRes.error || playerRes.error){ content.innerHTML = '<div class="empty">Error loading match data</div>'; console.error(teamRes.error||playerRes.error); return; }
  const teamRows = teamRes.data, playerRows = playerRes.data;

  const home = TEAMS[fx.home_team_id], away = TEAMS[fx.away_team_id];
  const homeM = teamMetricsFrom(teamRows, 0), awayM = teamMetricsFrom(teamRows, 1);
  const homeGL = homeM.total.carries ? homeM.total.gainline/homeM.total.carries*100 : 0;
  const awayGL = awayM.total.carries ? awayM.total.gainline/awayM.total.carries*100 : 0;

  content.replaceChildren();
  const score = document.createElement('div'); score.className='scorewrap';
  score.innerHTML = `
    <div class="scorebox">${fx.ft_h}</div>
    <div class="side"><div class="team">${home}</div><div class="gl">${U().gainline} ${homeGL.toFixed(0)}%</div></div>
    <div class="vs">${U().vs}</div>
    <div class="side"><div class="team">${away}</div><div class="gl">${U().gainline} ${awayGL.toFixed(0)}%</div></div>
    <div class="scorebox">${fx.ft_a}</div>`;
  content.appendChild(score);

  const cmpCard = document.createElement('div'); cmpCard.className='card';
  const cmpScroll = document.createElement('div'); cmpScroll.className='cmp-scroll';
  const tbl = document.createElement('table'); tbl.className='cmp';
  const thead = document.createElement('thead');
  const hr1 = document.createElement('tr');
  hr1.innerHTML = `<th colspan="3" class="teamhead">${home}</th><th></th><th colspan="3" class="teamhead">${away}</th>`;
  const hr2 = document.createElement('tr');
  hr2.innerHTML = `<th>${U().half1}</th><th>${U().half2}</th><th>${U().total}</th><th></th><th>${U().total}</th><th>${U().half2}</th><th>${U().half1}</th>`;
  thead.appendChild(hr1); thead.appendChild(hr2); tbl.appendChild(thead);
  const tb = document.createElement('tbody');
  ROWS.forEach(row=>{
    const tr = document.createElement('tr');
    const h1=rowVal(homeM[1],row), h2=rowVal(homeM[2],row), ht=rowVal(homeM.total,row);
    const a1=rowVal(awayM[1],row), a2=rowVal(awayM[2],row), at=rowVal(awayM.total,row);
    tr.innerHTML = `<td>${fmtVal(h1,row)}</td><td>${fmtVal(h2,row)}</td><td class="tot">${fmtVal(ht,row)}</td>`
      + `<td class="lbl">${U().rows[row.key]}</td>`
      + `<td class="tot">${fmtVal(at,row)}</td><td>${fmtVal(a2,row)}</td><td>${fmtVal(a1,row)}</td>`;
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); cmpScroll.appendChild(tbl); cmpCard.appendChild(cmpScroll); content.appendChild(cmpCard);

  const rosterCard = document.createElement('div'); rosterCard.className='card';
  const rh = document.createElement('h3'); rh.textContent = U().roster_title; rosterCard.appendChild(rh);
  const rWrap = document.createElement('div'); rWrap.className='rosters';
  [0,1].forEach(side=>{
    const players = playerRows.filter(r=>r.side===side)
      .map(r=>({shirt:r.shirt, name:PLAYERS[r.player_id], time:r.time, apm:r.apm}))
      .sort((a,b)=>(a.shirt||99)-(b.shirt||99));
    const box = document.createElement('div'); box.className='roster-scroll';
    const table = document.createElement('table'); table.className='roster';
    table.innerHTML = `<thead><tr><th>#</th><th>${U().roster_p}</th><th>${U().roster_t}</th><th>${U().roster_a}</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    players.forEach(p=>{ const tr=document.createElement('tr');
      tr.innerHTML = `<td>${p.shirt||'–'}</td><td>${p.name}</td><td>${Math.round(p.time)}</td><td>${p.apm.toFixed(2)}</td>`;
      tbody.appendChild(tr); });
    table.appendChild(tbody); box.appendChild(table); rWrap.appendChild(box);
  });
  rosterCard.appendChild(rWrap); content.appendChild(rosterCard);

  const tkCard = document.createElement('div'); tkCard.className='card';
  const th3 = document.createElement('h3'); th3.textContent = U().tackle_title; tkCard.appendChild(th3);
  const legend = document.createElement('div'); legend.className='legend';
  legend.innerHTML = `<span><span class="sw" style="background:${cssColor('--good')}"></span>${U().tk_succ}</span><span><span class="sw" style="background:${cssColor('--bad')}"></span>${U().tk_miss}</span>`;
  tkCard.appendChild(legend);
  const tkWrap = document.createElement('div'); tkWrap.className='rosters';
  [0,1].forEach(side=>{
    const players = playerRows.filter(r=>r.side===side)
      .map(r=>({name:PLAYERS[r.player_id], succ:r.tk_succ, miss:r.tk_missed}))
      .filter(p=>p.succ+p.miss>0)
      .sort((a,b)=>(b.succ+b.miss)-(a.succ+a.miss));
    const box = document.createElement('div'); box.id='tk-'+side; tkWrap.appendChild(box);
    hBarStack(box, players);
  });
  tkCard.appendChild(tkWrap); content.appendChild(tkCard);
}

function hBarStack(box, items){
  box.replaceChildren();
  const W=Math.max(box.clientWidth||420,320); const labelW=118, rightW=64, padT=4, padB=4, rowH=22, barH=14;
  const H=padT+Math.max(1,items.length)*rowH+padB, plotW=W-labelW-rightW;
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,role:'img'},box);
  const maxV=Math.max(1,...items.map(d=>d.succ+d.miss));
  const xs=v=>(v/maxV)*plotW;
  items.forEach((d,i)=>{ const y=padT+i*rowH+(rowH-barH)/2;
    const lab=el('text',{x:labelW-8,y:y+barH/2+4,'text-anchor':'end','font-size':11,fill:cssColor('--ink-2')},svg);
    lab.textContent=d.name.length>15?d.name.slice(0,14)+'…':d.name;
    const ws=xs(d.succ), wm=xs(d.miss);
    el('rect',{x:labelW,y,width:ws,height:barH,fill:cssColor('--good')},svg);
    el('rect',{x:labelW+ws,y,width:wm,height:barH,fill:cssColor('--bad')},svg);
    const r=el('text',{x:labelW+ws+wm+6,y:y+barH/2+4,'font-size':11,'font-weight':600,fill:cssColor('--ink-1')},svg);
    r.textContent=`${d.succ}/${d.miss}→${d.succ+d.miss}`;
  });
}

function setStaticChrome(){
  document.documentElement.lang=LANG;
  document.title=U().title+' — Rugby Analytics';
  document.getElementById('page-title').textContent=U().title;
  document.getElementById('page-sub').textContent=U().sub;
  document.getElementById('page-foot').textContent=U().foot;
  document.getElementById('nav-home').textContent=U().nav_home;
  document.getElementById('nav-kick').textContent=U().nav_kick;
  document.getElementById('nav-attack').textContent=U().nav_attack;
  document.getElementById('nav-defense').textContent=U().nav_defense;
  document.getElementById('nav-setpiece').textContent=U().nav_setpiece;
  document.getElementById('nav-game').textContent=U().nav_game;
  document.getElementById('lbl-season').textContent=U().f_season;
  document.getElementById('lbl-comp').textContent=U().f_comp;
  document.getElementById('lbl-round').textContent=U().f_round;
  document.getElementById('lbl-fixture').textContent=U().f_fixture;
  document.getElementById('lang-toggle').textContent=U().lang_btn;
  document.getElementById('logout-btn').textContent=U().logout_btn;
  document.getElementById('login-title').textContent=U().login_title;
  document.getElementById('login-submit').textContent=U().login_btn;
}

// --- auth ---
function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-content').style.display='none';
  document.getElementById('logout-btn').style.display='none';
}
async function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-content').style.display='';
  document.getElementById('logout-btn').style.display='';
  document.getElementById('content').innerHTML = '<div class="empty">'+U().loading+'</div>';
  await loadReference();
  syncFilters(false);
  render();
}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error'); errEl.textContent='';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; return; }
  await enterApp();
}
async function doLogout(){ await sb.auth.signOut(); showLogin(); }

async function init(){
  setStaticChrome();
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await enterApp(); } else { showLogin(); }
}
(function(){
  document.getElementById('lang-toggle').addEventListener('click', async ()=>{
    LANG=LANG==='ja'?'en':'ja'; localStorage.setItem('rugbyAnalyticsLang',LANG); setStaticChrome();
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ syncFilters(true); render(); }
  });
  document.getElementById('login-submit').addEventListener('click', doLogin);
  document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('f-season').addEventListener('change',()=>{ syncFilters(); render(); });
  document.getElementById('f-comp').addEventListener('change',()=>{ syncFilters(); render(); });
  document.getElementById('f-round').addEventListener('change',()=>{ syncFilters(true); render(); });
  document.getElementById('f-fixture').addEventListener('change',render);
  let rT; addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(render,150); });
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
  init();
})();
</script>
