<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — Rugby Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --border:rgba(11,11,11,0.10); --radius:10px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --border:rgba(255,255,255,0.10); } }
body { font-family: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--page); color:var(--ink-1); line-height:1.5;
  min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:30px 32px; width:100%; max-width:340px; }
.login-card .brand { font-weight:700; font-size:15px; margin-bottom:18px; }
.login-card h2 { font-size:18px; font-weight:700; margin-bottom:16px; }
.login-card input { width:100%; padding:10px 12px; font-size:16px; margin-bottom:10px;
  background:var(--page); border:1px solid var(--border); border-radius:6px; color:var(--ink-1); }
.login-card button { width:100%; padding:10px; font-size:14px; font-weight:600; color:#fff; background:#2a78d6;
  border:none; border-radius:6px; cursor:pointer; margin-top:4px; }
.login-card button:hover { background:#1f63b5; }
.login-card .err { color:#d64545; font-size:12px; margin-top:8px; min-height:1em; }
#lang-toggle{position:fixed;top:14px;right:14px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer;}
</style>
</head>
<body>
<button id="lang-toggle" type="button">EN</button>
<div class="login-card">
  <div class="brand">🏉 Rugby Analytics</div>
  <h2 id="login-title"></h2>
  <input id="login-email" type="email" autocomplete="username" placeholder="email@example.com">
  <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
  <button id="login-submit" type="button"></button>
  <div class="err" id="login-error"></div>
</div>
<script>
const SUPABASE_URL = 'https://lwsrrourcwidrujvaqvr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WUHxP4DDM9FRN4JfduqDNA_-S3lCM2p';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COOKIE_MAX_AGE = 60 * 60 * 12; // 12 hours

// Emails allowed to see recruit.html (university recruiting comparison --
// management staff only, not the general player/coach roster). Add/remove
// addresses here and redeploy to change who can reach that page.
//
// The 33 front-office/team-staff accounts created via
// scripts/create_users.py (see TBL Master File/scripts/staff_emails.csv,
// sourced from 【名簿】2026-27.xlsx's スタッフ sheet) are all "Staff" --
// normal dashboard access, same tier as players/coaches. Of those, the
// following 6 are additionally "Management" (GM/Assistant GM/Team
// Director/Head Coach/Coaching Coordinator/Team Manager) and get
// recruit.html access too:
const MANAGEMENT_EMAILS = [
  'shinrug67@gmail.com',
  'm.kunda0929@gmail.com',       // GM -- 薫田真広
  'y.morii1833@gmail.com',       // Assistant GM -- 森井康浩
  'takahiro.t.1107@gmail.com',   // Team Director -- 高木貴裕
  'joshsyms.hobm@gmail.com',     // Head Coach -- Joshua Syms
  'yskz514@gmail.com',           // Coaching Coordinator -- 森田佳寿
  'rshimaji0@gmail.com',         // Team Manager -- 島地利奈
];
function setAuthCookies(email){
  document.cookie = `sb-auth=1; Path=/; Max-Age=${COOKIE_MAX_AGE}; SameSite=Lax; Secure`;
  const isManagement = MANAGEMENT_EMAILS.includes((email||'').trim().toLowerCase());
  document.cookie = isManagement
    ? `mgmt-auth=1; Path=/; Max-Age=${COOKIE_MAX_AGE}; SameSite=Lax; Secure`
    : 'mgmt-auth=; Path=/; Max-Age=0; SameSite=Lax; Secure';
}

const UI = {
  ja:{ title:'ログイン', btn:'ログイン', lang_btn:'EN' },
  en:{ title:'Sign in', btn:'Sign in', lang_btn:'日本語' }
};
let LANG = localStorage.getItem('rugbyAnalyticsLang') || ((navigator.language||'').toLowerCase().startsWith('ja') ? 'ja' : 'en');
function U(){ return UI[LANG]; }
function setChrome(){
  document.documentElement.lang = LANG;
  document.getElementById('login-title').textContent = U().title;
  document.getElementById('login-submit').textContent = U().btn;
  document.getElementById('lang-toggle').textContent = U().lang_btn;
}
setChrome();
document.getElementById('lang-toggle').addEventListener('click', ()=>{
  LANG = LANG==='ja' ? 'en' : 'ja';
  localStorage.setItem('rugbyAnalyticsLang', LANG);
  setChrome();
});

function nextPath(){
  const p = new URLSearchParams(location.search).get('next');
  return (p && p.startsWith('/')) ? p : '/index.html';
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error'); errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  setAuthCookies(email);
  location.href = nextPath();
}
document.getElementById('login-submit').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e=>{ if (e.key === 'Enter') doLogin(); });

// Already logged in (valid Supabase session) but landed here anyway (e.g. stale cookie) -> just re-set the cookie and move on.
(async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if (session) {
    setAuthCookies(session.user.email);
    location.href = nextPath();
  }
})();
</script>
</body>
</html>
