<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme: dark;
  --page:#08080a; --surface:#14141a; --surface-2:#1b1b23; --ink-1:#f3f4f6; --ink-2:#c9cdd6; --ink-muted:#8b93a3;
  --border:rgba(197,160,89,.28); --border-strong:rgba(197,160,89,.5);
  --gold:#c5a059; --gold-soft:#e7cd94; --red:#ff0b24; --deepred:#6e0007; --radius:14px; }
body { font-family: Montserrat,system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:radial-gradient(1400px 700px at 12% -10%, rgba(197,160,89,.1), transparent 55%), radial-gradient(1200px 650px at 100% 100%, rgba(255,11,36,.08), transparent 55%), linear-gradient(180deg, #101014 0%, var(--page) 480px);
  color:var(--ink-1); line-height:1.5;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-card { background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--border);
  border-top:3px solid var(--red); border-radius:var(--radius); padding:34px 32px 30px; width:100%; max-width:360px;
  box-shadow:0 24px 48px -20px rgba(0,0,0,.65); }
.login-card .brand { font-weight:800; font-size:15px; color:var(--gold); margin-bottom:6px; letter-spacing:.02em; }
.login-card h2 { font-family:"Bebas Neue",Montserrat,sans-serif; font-weight:400; font-size:28px; letter-spacing:.03em;
  color:var(--gold-soft); margin-bottom:20px; }
.login-card input { width:100%; padding:11px 13px; font-size:16px; margin-bottom:11px;
  background:var(--page); border:1px solid #3a3a42; border-radius:8px; color:var(--ink-1); transition:border-color .12s; }
.login-card input:focus { outline:none; border-color:var(--border-strong); }
.login-card button { width:100%; padding:11px; font-size:14px; font-weight:700; letter-spacing:.02em; color:#fff;
  background:linear-gradient(135deg, var(--red), var(--deepred));
  border:none; border-radius:8px; cursor:pointer; margin-top:4px; transition:box-shadow .14s, transform .14s; }
.login-card button:hover { box-shadow:0 10px 24px -8px rgba(255,11,36,.5); transform:translateY(-1px); }
.login-card .err { color:#ff6b6b; font-size:12px; margin-top:10px; min-height:1em; }
#lang-toggle{position:fixed;top:14px;right:14px;font-size:12px;font-weight:700;color:var(--gold);background:var(--page);
  border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer;transition:background .12s,border-color .12s;}
#lang-toggle:hover{background:rgba(255,255,255,.06);border-color:var(--border-strong);}
</style>
</head>
<body>
<button id="lang-toggle" type="button">EN</button>
<div class="login-card">
  <div class="brand">🏉 RUGBY ANALYTICS</div>
  <h2 id="login-title"></h2>
  <input id="login-email" type="email" autocomplete="username" placeholder="email@example.com">
  <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
  <button id="login-submit" type="button"></button>
  <div class="err" id="login-error"></div>
</div>
<script>
const SUPABASE_URL = 'https://lwsrrourcwidrujvaqvr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WUHxP4DDM9FRN4JfduqDNA_-S3lCM2p';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COOKIE_MAX_AGE = 60 * 60 * 12; // 12 hours

// Three access tiers, checked in this order (an email can only be one
// tier -- Management is not "Staff plus extra", it's its own category).
// Not listed in either array below = "player" (the default; there's no
// explicit roster for the ~70 existing player/coach accounts, so this
// stays implicit rather than requiring one).
//
// - player:     normal dashboard access (index/kick/attack/defense/
//               lineout/scrum/game/compare). The default.
// - staff:      same normal dashboard access as player, for now -- listed
//               explicitly so page-level access can be split out later
//               (e.g. a staff-only page) without re-deriving who's staff.
// - management: normal dashboard access + recruit.html (university
//               recruiting comparison -- sensitive, not for the general
//               roster).
//
// Add/remove addresses here and redeploy to change who's in which tier.
const MANAGEMENT_EMAILS = [
  'shinrug67@gmail.com',
  'm.kunda0929@gmail.com',       // GM -- 薫田真広
  'y.morii1833@gmail.com',       // Assistant GM -- 森井康浩
  'takahiro.t.1107@gmail.com',   // Team Director -- 高木貴裕
  'joshsyms.hobm@gmail.com',     // Head Coach -- Joshua Syms
  'yskz514@gmail.com',           // Coaching Coordinator -- 森田佳寿
  'rshimaji0@gmail.com',         // Team Manager -- 島地利奈
];
// Front-office/team-staff accounts (created via scripts/create_users.py,
// see TBL Master File/scripts/staff_emails.csv, sourced from
// 【名簿】2026-27.xlsx's スタッフ sheet) that are NOT already in
// MANAGEMENT_EMAILS above.
const STAFF_EMAILS = [
  'toddblackadder71@gmail.com',      // Advisor -- Todd Blackadder
  'will.j.eggleston@gmail.com',      // DF Coach -- Will Eggleston
  'aflevans@hotmail.com',            // AT Coach -- Nick Evans
  'brynevansvo@gmail.com',           // Head FW Coach -- Bryn Evans
  'mizuma23@gmail.com',              // Scrum Coach -- 水間良武
  'thel0m.g61@gmail.com',            // Assistant Coach -- 藤田貴大
  'anisesamuela34@gmail.com',        // K9 Coach -- Anise Samuela
  'masahikomiyao1971@gmail.com',     // High Performance Analyst -- 宮尾正彦
  'kazuya.konuma0815@gmail.com',     // Analyst -- 小沼和也
  'Cockatoocollins@yahoo.com',       // Head S&C Coach -- Nick Collins
  'usuchandayo@gmail.com',           // Performance Coach -- 宇薄岳央
  'yamato.tr1117@gmail.com',         // Assistant S&C Coach -- 小峯大和
  'yosuke1784@gmail.com',            // Head Athletic Trainer -- 滝田陽介
  'shinichi.k.2139@gmail.com',       // Athletic Trainer -- 近藤信一
  'tkwk.no@gmail.com',               // Athletic Trainer -- 塚脇望
  'kimsusong.tr@gmail.com',          // Athletic Trainer -- 金秀成
  'ryoyamanchi@gmail.com',           // Interpreter -- 山内遼
  '424len@gmail.com',                // Interpreter -- シンクル蓮
  'naotoshibata.bbhc@gmail.com',     // Interpreter -- 柴田直登
  'saori.tswork@gmail.com',          // Administrator/Interpreter -- 高橋沙麻里
  'htakeda.tky@gmail.com',           // Team Doctor -- 武田秀樹
  'kazuhiro04132001@gmail.com',      // Team Doctor -- 柴山一洋
  'ken_higashiyama1104@yahoo.co.jp', // Team Doctor -- 高木健太郎
  't_mode_teppei1001@yahoo.co.jp',   // Team Doctor -- 田中哲平
  'hitoshi5japan@yahoo.co.jp',       // Trainer -- 石井斉
  'ma34moriguchi@gmail.com',         // Trainer -- 森口雅司
];
function roleFor(email){
  const e = (email || '').trim().toLowerCase();
  if (MANAGEMENT_EMAILS.includes(e)) return 'management';
  if (STAFF_EMAILS.includes(e)) return 'staff';
  return 'player';
}
function setAuthCookies(email){
  document.cookie = `sb-auth=1; Path=/; Max-Age=${COOKIE_MAX_AGE}; SameSite=Lax; Secure`;
  document.cookie = `role=${roleFor(email)}; Path=/; Max-Age=${COOKIE_MAX_AGE}; SameSite=Lax; Secure`;
}

const UI = {
  ja:{ title:'ログイン', btn:'ログイン', lang_btn:'EN' },
  en:{ title:'Sign in', btn:'Sign in', lang_btn:'日本語' }
};
let LANG = localStorage.getItem('rugbyAnalyticsLang') || ((navigator.language||'').toLowerCase().startsWith('ja') ? 'ja' : 'en');
function U(){ return UI[LANG]; }
function setChrome(){
  document.documentElement.lang = LANG;
  document.getElementById('login-title').textContent = U().title;
  document.getElementById('login-submit').textContent = U().btn;
  document.getElementById('lang-toggle').textContent = U().lang_btn;
}
setChrome();
document.getElementById('lang-toggle').addEventListener('click', ()=>{
  LANG = LANG==='ja' ? 'en' : 'ja';
  localStorage.setItem('rugbyAnalyticsLang', LANG);
  setChrome();
});

function nextPath(){
  const p = new URLSearchParams(location.search).get('next');
  return (p && p.startsWith('/')) ? p : '/index.html';
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error'); errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  setAuthCookies(email);
  location.href = nextPath();
}
document.getElementById('login-submit').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e=>{ if (e.key === 'Enter') doLogin(); });

// Already logged in (valid Supabase session) but landed here anyway (e.g. stale cookie) -> just re-set the cookie and move on.
(async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if (session) {
    setAuthCookies(session.user.email);
    location.href = nextPath();
  }
})();
</script>
</body>
</html>
