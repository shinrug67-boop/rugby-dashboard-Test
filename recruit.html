body { font-family: Montserrat,system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;

.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;

.topnav .navlinks{display:flex;gap:4px;flex-wrap:wrap;}
.topnav .navlinks a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-weight:600;}
.topnav .navlinks a:hover{background:rgba(255,255,255,.06);}
.topnav .navlinks a.active{background:var(--red);color:#fff;}
.topnav .spacer{flex:1;}
#lang-toggle{font-size:12px;font-weight:700;color:var(--gold);background:var(--page);border:1px solid var(--border);

.wrap { max-width:1100px; margin:0 auto; padding:18px var(--gap) 32px; }
header h1 { font-size:20px; font-weight:800; letter-spacing:.01em; }

.picker .fg select { width:100%; max-width:none; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:var(--gap); min-width:0; }
.card h3 { font-size:14px; font-weight:700; margin-bottom:2px; }
.card .desc { font-size:12px; color:var(--ink-muted); margin-bottom:10px; }

.row { display:grid; grid-template-columns:1fr 2fr 1fr; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--grid); }
.row:last-child { border-bottom:none; }
.row .val { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
.row .val.a { text-align:right; color:var(--a); }
.row .val.b { text-align:left; color:var(--b); }
.row .note { font-size:11px; font-weight:400; color:var(--ink-muted); }
.row .mid { text-align:center; }
.row .mid .lbl { font-size:12px; color:var(--ink-2); margin-bottom:4px; }
.bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--grid); }
.bar .a { background:var(--a); }
.bar .b { background:var(--b); }
.kick-mix { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); margin-top:6px; }
.kick-mix .col { font-size:12px; }
.kick-mix .col.a { text-align:right; color:var(--ink-2); }
.kick-mix .col.b { text-align:left; color:var(--ink-2); }
.kick-mix .col div { padding:2px 0; }
table { width:100%; border-collapse:collapse; font-size:13px; }

tbody td { padding:7px 9px; border-bottom:1px solid var(--grid); text-align:right; font-variant-numeric:tabular-nums; }
tbody td:first-child, tbody td:nth-child(2) { text-align:left; }
.tbl-scroll { overflow:auto; max-width:100%; min-width:0; }

    m_tackles:'Tackles', m_tackle_pct:'Tackle success%', m_jackal:'Jackal', m_jackal_pct:'Jackal success%',
    m_atk_ooa:'Attack OOA', m_def_ooa:'Defense OOA',
    m_kicks:'Kicks', m_kickmtr:'Kick metres', m_apm:'Action/Min',
    kick_retained:'Regained', kick_pressure:'Forced error', kick_notsecured:'Fail to secure',
    kick_lost:'Opp. secured', kick_touch:'Touch', kick_error:'Error',
    ho_throw:'Lineout throw success%', ho_throw_n:'Throws',
    lo_catch:'Lineout success% (catch)', lo_catch_n:'AT catches', lo_steal:'DF lineout steals',
    note_total:(tot)=>`Total ${tot}`,
    note_pct:(n,d)=>`${n} / ${d}`,
    off_scrum_pct:'Attack scrum success%', def_scrum_pressure:'Defense scrum pressure%', def_scrum_success:'Defense scrum success%',
    foot:'Definitions: Carry metres=Distance+ / Post-contact m=sum of Metres3 / DF Beaten=Attacking Qualities×Defender Beaten / Offload=Pass×Offload (result Own Player/To Ground/To Opposition), success=Own Player / Tackle success=(success variants+Offload Allowed/Pen Conceded)÷tackles (Missed/Ineffective excluded) / Jackal=Collection×Jackal, success=Success / OOA=Ruck OOA qualifier4 (Attacking/Defensive OOA) / Kick metres=Distance+ summed over Kick in Play qualifiers / Lineout throw success=thrower\'s own Won÷own throws (Hookers only) / Lineout success (catch)=catcher\'s own-throw Won÷own catches, DF steal=Lineout Take Steal variants (Locks only) / Attack scrum success%=Offensive Scrum (action=28) individual participation rows with Won Outright/Won Free Kick/Won Penalty/Won Penalty Try/Won Try÷total participations / Defense scrum pressure%=Defensive Scrum (action=29) rows with Lost Outright/Lost Free Kick/Lost Pen Con/Lost Reversed÷total participations / Defense scrum success%=pressure% numerator plus Won Outright (no penalty conceded = success). Position = the player\'s career-long most frequent position. Data: Opta (Stats Perform, Level 2 Restricted).' }
};
let LANG = localStorage.getItem('rugbyAnalyticsLang') || ((navigator.language||'').toLowerCase().startsWith('ja') ? 'ja' : 'en');
function U(){ return UI[LANG]; }
function f1(v){ return v.toFixed(1); }
function pct(n,d){ return d? (n/d*100) : 0; }
function emptyAcc(){ const c={}; PM.forEach(m=>c[m]=0); c.__m=0; return c; }

function v(id){ return document.getElementById(id).value; }
const F = { comp:()=>v('f-comp'), season:()=>v('f-season'), teamA:()=>v('f-team-a'), playerA:()=>v('f-player-a'), teamB:()=>v('f-team-b'), playerB:()=>v('f-player-b') };

function rowsFor(playerIdx){
  const comp=F.comp(), season=F.season();
  return RAW.P.filter(r=>r[3]===playerIdx && (comp==='all'||RAW.comps[r[0]]===comp) && (season==='all'||String(r[1])===season));
}
function accumFor(playerIdx, teamIdx){
  const acc = emptyAcc();
  rowsFor(playerIdx).filter(r=>teamIdx==null||r[2]===teamIdx).forEach(r=>{
    acc.__m += r[4];
    PM.forEach(m=>acc[m]+=r[pIdx[m]]);
  });
  return acc;
}
function teamsForPlayer(playerIdx){
  const s = new Set(); RAW.P.forEach(r=>{ if(r[3]===playerIdx) s.add(r[2]); });
  return [...s].sort((a,b)=>RAW.teams[a].localeCompare(RAW.teams[b]));
}
function playersForTeam(teamIdx){
  const s = new Set(); RAW.P.forEach(r=>{ if(r[2]===teamIdx) s.add(r[3]); });
  return [...s].sort((a,b)=>RAW.players[a].localeCompare(RAW.players[b]));
}

function repop(sel, values, labelFn, current){
  const s=document.getElementById(sel); const prev = current!==undefined?current:s.value; s.replaceChildren();
  values.forEach(val=>{ const o=document.createElement('option'); o.value=String(val); o.textContent=labelFn(val); s.appendChild(o); });
  if(values.map(String).includes(prev)) s.value=prev; else if(values.length) s.value=String(values[0]);
}

function syncTeamPlayer(side){
  const teamSel = 'f-team-'+side, playerSel = 'f-player-'+side;
  const teamIdx = Number(v(teamSel));
  const players = playersForTeam(teamIdx);
  repop(playerSel, players, i=>RAW.players[i]);
}

function fmtVal(x, digits){ return (digits===0? Math.round(x).toLocaleString() : x.toFixed(digits)); }

function cmpRow(container, label, valA, valB, digits, noteA, noteB){
  const row = document.createElement('div'); row.className='row';
  const dispA = valA==null ? '–' : fmtVal(valA,digits), dispB = valB==null ? '–' : fmtVal(valB,digits);
  const a = document.createElement('div'); a.className='val a'; a.innerHTML = `${dispA}${noteA?`<div class="note">${noteA}</div>`:''}`;
  const mid = document.createElement('div'); mid.className='mid';
  const lbl = document.createElement('div'); lbl.className='lbl'; lbl.textContent = label; mid.appendChild(lbl);
  const bar = document.createElement('div'); bar.className='bar';
  const nA = valA||0, nB = valB||0;
  const ba = document.createElement('div'); ba.className='a'; ba.style.width = (nA/(nA+nB||1)*100)+'%';
  const bb = document.createElement('div'); bb.className='b'; bb.style.width = (nB/(nA+nB||1)*100)+'%';
  bar.appendChild(ba); bar.appendChild(bb); mid.appendChild(bar);
  const b = document.createElement('div'); b.className='val b'; b.innerHTML = `${dispB}${noteB?`<div class="note">${noteB}</div>`:''}`;
  row.appendChild(a); row.appendChild(mid); row.appendChild(b);
  container.appendChild(row);
}

function section(container, title){
  const h = document.createElement('div'); h.className='section-h'; h.textContent = title;
  container.appendChild(h);
  const card = document.createElement('div'); card.className='card';
  container.appendChild(card);
  return card;
}

function totalAvgRow(card, label, ca, cb, key, digits){
  const totA = ca[key], totB = cb[key];
  const avgA = ca.__m? totA/ca.__m : 0, avgB = cb.__m? totB/cb.__m : 0;
  cmpRow(card, label, avgA, avgB, 1,
    U().note_total(fmtVal(totA,digits)),
    U().note_total(fmtVal(totB,digits)));
}
function pctRow(card, label, ca, cb, numKey, denKey){
  const pa = pct(ca[numKey], ca[denKey]), pb = pct(cb[numKey], cb[denKey]);
  cmpRow(card, label, pa, pb, 1, U().note_pct(ca[numKey], ca[denKey]), U().note_pct(cb[numKey], cb[denKey]));
}

function kickMix(card, ca, cb){
  const keys = ['kick_retained','kick_pressure','kick_notsecured','kick_lost','kick_touch','kick_error'];
  const mix = document.createElement('div'); mix.className='kick-mix';
  const colA = document.createElement('div'); colA.className='col a';
  const colB = document.createElement('div'); colB.className='col b';
  keys.forEach(k=>{
    const la = document.createElement('div'); const lb = document.createElement('div');
    const pa = pct(ca[k], ca.kicks), pb = pct(cb[k], cb.kicks);
    la.textContent = `${U()[k]}: ${ca[k]} (${pa.toFixed(0)}%)`;
    lb.textContent = `${U()[k]}: ${cb[k]} (${pb.toFixed(0)}%)`;
    colA.appendChild(la); colB.appendChild(lb);
  });
  mix.appendChild(colA); mix.appendChild(colB);
  card.appendChild(mix);
}

function playtimeTable(playerIdx){
  const rows = rowsFor(playerIdx).slice().sort((x,y)=> x[1]-y[1]);
  const wrap = document.createElement('div'); wrap.className='tbl-scroll';
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>${U().col_season}</th><th>${U().col_team}</th><th>${U().col_min}</th><th>${U().col_gp}</th><th>${U().col_avgmin}</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const gp = r[4], mins = r[pIdx.playtime];
    tr.innerHTML = `<td>${r[1]}</td><td>${RAW.teams[r[2]]}</td><td>${Math.round(mins)}</td><td>${gp}</td><td>${gp?(mins/gp).toFixed(1):'–'}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); wrap.appendChild(table);
  return wrap;
}

function fwBlocks(container, posA, posB, ca, cb){
  const hoA = HO_POS.has(posA), hoB = HO_POS.has(posB);
  if(hoA || hoB){
    const card = section(container, U().sec_fw + ' — Hooker');
    const pA = hoA ? pct(ca.lo_throw_won, ca.lo_throw_total) : null;
    const pB = hoB ? pct(cb.lo_throw_won, cb.lo_throw_total) : null;
    cmpRow(card, U().ho_throw, pA, pB, 1,
      hoA ? `${U().ho_throw_n}: ${ca.lo_throw_total}` : '',
      hoB ? `${U().ho_throw_n}: ${cb.lo_throw_total}` : '');
  }
  const loA = LO_POS.has(posA), loB = LO_POS.has(posB);
  if(loA || loB){
    const title = loA ? posA : posB;
    const card = section(container, U().sec_fw + ' — ' + title);
    const catchA = loA ? pct(ca.lo_catch_won, ca.lo_catch_total) : null;
    const catchB = loB ? pct(cb.lo_catch_won, cb.lo_catch_total) : null;
    cmpRow(card, U().lo_catch, catchA, catchB, 1,
      loA ? `${U().lo_catch_n}: ${ca.lo_catch_total}` : '',
      loB ? `${U().lo_catch_n}: ${cb.lo_catch_total}` : '');
    const stealA = loA ? ca.lo_steal : null, stealB = loB ? cb.lo_steal : null;
    cmpRow(card, U().lo_steal, stealA, stealB, 0,
      loA ? f1(ca.__m?ca.lo_steal/ca.__m:0)+'/match' : '',
      loB ? f1(cb.__m?cb.lo_steal/cb.__m:0)+'/match' : '');
  }
}

function scrumBlock(container, ca, cb){
  const hasOff = ca.off_scrum_total>0 || cb.off_scrum_total>0;
  const hasDef = ca.def_scrum_total>0 || cb.def_scrum_total>0;
  if(!hasOff && !hasDef) return;
  const card = section(container, U().sec_scrum);
  if(hasOff){
    const pA = ca.off_scrum_total ? pct(ca.off_scrum_success, ca.off_scrum_total) : null;
    const pB = cb.off_scrum_total ? pct(cb.off_scrum_success, cb.off_scrum_total) : null;
    cmpRow(card, U().off_scrum_pct, pA, pB, 1,
      ca.off_scrum_total ? `${ca.off_scrum_success} / ${ca.off_scrum_total}` : '',
      cb.off_scrum_total ? `${cb.off_scrum_success} / ${cb.off_scrum_total}` : '');
  }
  if(hasDef){
    const prA = ca.def_scrum_total ? pct(ca.def_scrum_pressure, ca.def_scrum_total) : null;
    const prB = cb.def_scrum_total ? pct(cb.def_scrum_pressure, cb.def_scrum_total) : null;
    cmpRow(card, U().def_scrum_pressure, prA, prB, 1,
      ca.def_scrum_total ? `${ca.def_scrum_pressure} / ${ca.def_scrum_total}` : '',
      cb.def_scrum_total ? `${cb.def_scrum_pressure} / ${cb.def_scrum_total}` : '');
    const suA = ca.def_scrum_total ? pct(ca.def_scrum_success, ca.def_scrum_total) : null;
    const suB = cb.def_scrum_total ? pct(cb.def_scrum_success, cb.def_scrum_total) : null;
    cmpRow(card, U().def_scrum_success, suA, suB, 1,
      ca.def_scrum_total ? `${ca.def_scrum_success} / ${ca.def_scrum_total}` : '',
      cb.def_scrum_total ? `${cb.def_scrum_success} / ${cb.def_scrum_total}` : '');
  }
}

function render(){
  const content = document.getElementById('content'); content.replaceChildren();
  const teamA = Number(v('f-team-a')), playerA = v('f-player-a');
  const teamB = Number(v('f-team-b')), playerB = v('f-player-b');
  if(playerA==='' || playerB===''){ content.innerHTML = `<div class="empty">${U().empty}</div>`; return; }
  const pA = Number(playerA), pB = Number(playerB);
  const logoA = teamLogoSrc(RAW.teams[teamA]), logoB = teamLogoSrc(RAW.teams[teamB]);
  document.getElementById('name-a').innerHTML = (logoA?`<img src="${logoA}" alt="" style="height:18px;vertical-align:-3px;margin-right:6px">`:'') + RAW.players[pA];
  document.getElementById('name-b').innerHTML = (logoB?`<img src="${logoB}" alt="" style="height:18px;vertical-align:-3px;margin-right:6px">`:'') + RAW.players[pB];
  const posA = RAW.playerPos[pA], posB = RAW.playerPos[pB];
  document.getElementById('pos-a').textContent = posA || '';
  document.getElementById('pos-b').textContent = posB || '';

  const ca = accumFor(pA, teamA), cb = accumFor(pB, teamB);

  // Playtime (season breakdown, ignores comp/season filters above)
  const ptCard = section(content, U().sec_time);
  ptCard.appendChild(document.createTextNode(''));
  const ptWrap = document.createElement('div'); ptWrap.className='picker';
  const boxA = document.createElement('div'); boxA.className='pt-box'; boxA.appendChild(playtimeTable(pA));
  const boxB = document.createElement('div'); boxB.className='pt-box'; boxB.appendChild(playtimeTable(pB));
  ptWrap.appendChild(boxA); ptWrap.appendChild(boxB);
  ptCard.appendChild(ptWrap);

  const atk = section(content, U().sec_attack);
  totalAvgRow(atk, U().m_carries, ca, cb, 'carries', 0);
  totalAvgRow(atk, U().m_carrym, ca, cb, 'carry_distplus', 0);
  totalAvgRow(atk, U().m_post, ca, cb, 'carry_post', 0);
  totalAvgRow(atk, U().m_beaten, ca, cb, 'def_beaten', 0);
  totalAvgRow(atk, U().m_offload, ca, cb, 'offload', 0);
  pctRow(atk, U().m_offload_pct, ca, cb, 'offload_success', 'offload');
  totalAvgRow(atk, U().m_linebreak, ca, cb, 'linebreak', 0);
  totalAvgRow(atk, U().m_passes, ca, cb, 'passes', 0);

  const def = section(content, U().sec_defense);
  totalAvgRow(def, U().m_tackles, ca, cb, 'tackles', 0);
  pctRow(def, U().m_tackle_pct, ca, cb, 'tk_succ', 'tackles');
  totalAvgRow(def, U().m_jackal, ca, cb, 'jackal', 0);
  pctRow(def, U().m_jackal_pct, ca, cb, 'jackal_won', 'jackal');

  const ooa = section(content, U().sec_breakdown);
  totalAvgRow(ooa, U().m_atk_ooa, ca, cb, 'atk_ooa', 0);
  totalAvgRow(ooa, U().m_def_ooa, ca, cb, 'def_ooa', 0);

  const kick = section(content, U().sec_kick);
  totalAvgRow(kick, U().m_kicks, ca, cb, 'kicks', 0);
  totalAvgRow(kick, U().m_kickmtr, ca, cb, 'kick_mtr', 0);
  kickMix(kick, ca, cb);

  const other = section(content, U().sec_other);
  const apmA = ca.playtime? ca.actions/ca.playtime : 0, apmB = cb.playtime? cb.actions/cb.playtime : 0;
  cmpRow(other, U().m_apm, apmA, apmB, 2);

  fwBlocks(content, posA, posB, ca, cb);
  scrumBlock(content, ca, cb);
}

function setStaticChrome(){
  document.documentElement.lang = LANG;
  document.title = U().doctitle;
  document.getElementById('page-title').textContent = U().page_title;
  document.getElementById('page-sub').textContent = U().page_sub;
  document.getElementById('page-foot').textContent = U().foot;
  document.getElementById('nav-home').textContent = U().nav_home;
  document.getElementById('nav-kick').textContent = U().nav_kick;
  document.getElementById('nav-attack').textContent = U().nav_attack;
  document.getElementById('nav-defense').textContent = U().nav_defense;
  document.getElementById('nav-setpiece').textContent = U().nav_setpiece;
  document.getElementById('nav-game').textContent = U().nav_game;
  document.getElementById('nav-compare').textContent = U().nav_compare;
  document.getElementById('nav-recruit').textContent = U().nav_recruit;
  document.getElementById('lbl-comp').textContent = U().f_comp;
  document.getElementById('lbl-season').textContent = U().f_season;
  document.querySelector('#f-comp option[value="all"]').textContent = U().all_comp;
  document.querySelector('#f-season option[value="all"]').textContent = U().all_season;
  document.getElementById('lbl-team-a').textContent = U().team_a;
  document.getElementById('lbl-player-a').textContent = U().player_a;
  document.getElementById('lbl-team-b').textContent = U().team_b;
  document.getElementById('lbl-player-b').textContent = U().player_b;
  document.getElementById('lang-toggle').textContent = U().lang_btn;
  document.getElementById('logout-btn').textContent = U().logout_btn;
}

async function doLogout(){
  await sb.auth.signOut();
  document.cookie = 'sb-auth=; Path=/; Max-Age=0; SameSite=Lax; Secure';
  document.cookie = 'mgmt-auth=; Path=/; Max-Age=0; SameSite=Lax; Secure';
  location.href = 'login.html';
}

(function(){
  const nav = document.querySelector('.navlinks a[data-nav="recruit"]'); if(nav) nav.classList.add('active');

  const cs = document.getElementById('f-comp');
  RAW.comps.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cs.appendChild(o); });
  const seasons = [...new Set(RAW.P.map(r=>r[1]))].sort();
  const ss = document.getElementById('f-season');
  seasons.forEach(s=>{ const o=document.createElement('option'); o.value=String(s); o.textContent=String(s); ss.appendChild(o); });

  const allTeamsSorted = RAW.teams.map((name,i)=>i).sort((a,b)=>RAW.teams[a].localeCompare(RAW.teams[b]));
  repop('f-team-a', allTeamsSorted, i=>RAW.teams[i]);
  repop('f-team-b', allTeamsSorted, i=>RAW.teams[i]);
  syncTeamPlayer('a'); syncTeamPlayer('b');

  setStaticChrome();
  render();

  document.getElementById('lang-toggle').addEventListener('click', ()=>{
    LANG = LANG==='ja' ? 'en' : 'ja'; localStorage.setItem('rugbyAnalyticsLang', LANG);
    setStaticChrome(); render();
  });
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('f-comp').addEventListener('change', render);
  document.getElementById('f-season').addEventListener('change', render);
  document.getElementById('f-team-a').addEventListener('change', ()=>{ syncTeamPlayer('a'); render(); });
  document.getElementById('f-team-b').addEventListener('change', ()=>{ syncTeamPlayer('b'); render(); });
  document.getElementById('f-player-a').addEventListener('change', render);
  document.getElementById('f-player-b').addEventListener('change', render);
})();
</script>
